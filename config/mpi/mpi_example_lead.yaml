time_limit: 1200 # Seconds
max_generations: 1000
# seed: 0 # Set seed

### Common Args - output_dir, device(, logger) are automatically applied to all classes that have arguments with the same names. This is also applied to node_class_variables.###
output_dir: generation_results
device: cpu

### Logging Options ###
debug: false # Set to true to enable debug logging
silent: false # Set to true to disable console logging

node_class: CanonicalSMILESStringNode
root: c1ccccc1

reward_class: LogPReward

transition_class: GBGATransition
transition_args:
  check_size: false
  check_ring: true
  filters:
    - filter_class: ValidityFilter
    - filter_class: RadicalFilter
    - filter_class: ChargeFilter
    # It is recommended to restrict the molecular size (via atom counts or molecular weight etc.) when using transitions like SMIRKSTransition or GBGATransition to prevent excessive growth of the search tree.
    - filter_class: HeavyAtomCountFilter
      max: 50

reward_class: JScoreReward # Lightweight reward for testing

### Policy ###
policy_class: PUCT
policy_args:
  c: 0.25
  best_rate: 0.9

### Generator ###
generator_class: AsyncParallelMCTS
generator_args:
  dispatcher_type: mpi
  n_eval_width: .inf # If the reward calculation is expensive, n_eval_width = 1 might be more sample efficient.
  n_eval_iters: 1
  n_tries: 1
  filter_reward: 0
  avoid_duplicates: true
  info_interval: 100  # Interval to log the average reward

### Plot Setting ###
plot_args:
  moving_average_window: 0.05
  reward_top_ps: [0.5, 0.1]