<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChemTSv3 visualizer</title>
<style>
  :root { color-scheme: light; font: 14px system-ui, sans-serif; color: #243647; background: #f3f6f8; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; min-height: 560px; display: flex; flex-direction: column; }
  header { padding: 18px 24px; display: flex; gap: 18px; align-items: baseline; background: #142d40; color: white; flex-shrink: 0; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  #summary { color: #bdd1dd; font-size: 13px; white-space: pre-wrap; }
  .view-switch { margin-left: auto; display: flex; gap: 6px; }
  .view-switch button { border-color: #526d80; background: transparent; color: #bdd1dd; }
  .view-switch button[aria-pressed="true"] { background: white; border-color: white; color: #142d40; }
  #tree-view { display: contents; }
  #scatter-view { flex: 1; min-height: 0; }
  #scatter-frame { display: block; width: 100%; height: 100%; border: 0; }
  button, input { font: inherit; }
  button { border: 1px solid #cbd7df; background: white; color: #243647; padding: 6px 11px; border-radius: 5px; cursor: pointer; }
  button:hover { background: #edf6f6; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible, tr:focus-visible, canvas:focus-visible, [role="separator"]:focus-visible { outline: 2px solid #008b82; outline-offset: -2px; }
  .toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid #d9e2e8; background: white; flex-shrink: 0; }
  .toolbar label { display: flex; gap: 6px; align-items: center; }
  .muted { color: #617786; font-size: 12px; }
  #zoom { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
  #depth { width: 120px; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 8px var(--details-width, 300px); flex: 0 0 var(--workspace-height, 54vh); min-height: 180px; }
  .splitter { background: #e1e9ee; touch-action: none; position: relative; flex-shrink: 0; }
  .splitter::after { content: ''; position: absolute; border-radius: 2px; background: #9aafb9; }
  .splitter.vertical { cursor: col-resize; }
  .splitter.vertical::after { width: 2px; height: 32px; left: 3px; top: calc(50% - 16px); }
  .splitter.horizontal { height: 8px; cursor: row-resize; }
  .splitter.horizontal::after { height: 2px; width: 32px; top: 3px; left: calc(50% - 16px); }
  .splitter:hover, .splitter.active, .column-resizer:hover, .column-resizer.active { background: #a9d7cf; }
  body.resizing { user-select: none; }
  body.resizing * { cursor: inherit !important; }
  .tree { min-width: 0; min-height: 0; position: relative; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .hint { position: absolute; bottom: 10px; left: 16px; background: #ffffffdf; padding: 5px 8px; border-radius: 4px; pointer-events: none; }
  #branch-action { position: absolute; z-index: 1; font-size: 12px; border-color: #008b82; box-shadow: 0 2px 8px #142d4020; white-space: nowrap; }
  aside { padding: 18px; overflow: auto; min-width: 0; background: white; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  #node-key, #result-key { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px ui-monospace, monospace; background: #f3f6f8; border-radius: 5px; padding: 10px; }
  .node-state { position: relative; margin-bottom: 10px; }
  .node-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  #path-status { margin: 8px 0 0; }
  #node-key { min-height: 46px; padding-right: 46px; }
  .copy-button { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; padding: 6px; display: grid; place-items: center; }
  .copy-button svg { width: 16px; height: 16px; }
  .copy-button::after { content: attr(aria-label); position: absolute; right: 0; bottom: calc(100% + 6px); padding: 5px 8px; border-radius: 4px; background: #142d40; color: white; font-size: 12px; white-space: nowrap; pointer-events: none; visibility: hidden; }
  .copy-button:hover::after, .copy-button:focus-visible::after { visibility: visible; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #node-image, #result-image { width: 100%; max-height: 160px; object-fit: contain; }
  [hidden] { display: none !important; }
  dl { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 6px 10px; font-size: 12px; }
  dt { color: #617786; }
  dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; white-space: pre-wrap; }
  #result-detail { margin-top: 20px; border-top: 1px solid #d9e2e8; padding-top: 15px; }
  .results { background: white; display: flex; flex-direction: column; flex: 1; min-height: 140px; }
  .results h2 { margin: 0 8px 0 0; }
  #search { border: 1px solid #cbd7df; padding: 7px 10px; border-radius: 5px; width: 230px; }
  .spacer { flex: 1; }
  .table-scroll { overflow: auto; flex: 1; min-height: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th { position: sticky; top: 0; background: #edf3f6; text-align: left; z-index: 1; }
  th button { border: 0; background: transparent; width: 100%; border-radius: 0; text-align: left; font-weight: 600; white-space: nowrap; padding: 10px 20px 10px 14px; overflow: hidden; text-overflow: ellipsis; }
  th.image-column { padding: 10px 14px; }
  .column-resizer { position: absolute; top: 0; right: 0; bottom: 0; width: 8px; cursor: col-resize; touch-action: none; border-right: 1px solid #cbd7df; }
  td { padding: 8px 14px; border-bottom: 1px solid #e6edf1; font-variant-numeric: tabular-nums; max-width: 420px; overflow-wrap: anywhere; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f0f8f8; }
  tbody tr.related { background: #eff8f6; }
  tbody tr.selected { background: #d7eee8; box-shadow: inset 3px 0 #008b82; }
  td img { width: 130px; max-width: 100%; height: 80px; object-fit: contain; display: block; }
  #empty { text-align: center; padding: 30px; }
  @media (max-width: 740px) { .workspace { --details-width: 220px; } aside { padding: 12px; } header { flex-wrap: wrap; gap: 6px; } }
</style>
<header><h1>ChemTSv3 visualizer</h1><span id="summary"></span><nav class="view-switch" aria-label="Visualization"><button id="view-scatter" aria-pressed="false" aria-controls="scatter-view">Scatter</button><button id="view-tree" aria-pressed="true" aria-controls="tree-view">Tree</button></nav></header>
<div id="tree-view">
<div class="toolbar">
  <button id="fit">Fit tree</button><button id="align-path" title="Align and center the highlighted path">Align path</button><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom"></span><button id="zoom-in" aria-label="Zoom in">+</button>
  <label>Depth <input id="depth" type="range" min="0" value="3"><output id="depth-value"></output></label>
  <button id="show-depth">Show up to depth 3</button><button id="reset">Reset</button>
  <label><input id="rollouts" type="checkbox" checked> Show rollouts</label>
</div>
<div class="workspace" id="workspace">
  <div class="tree"><canvas id="tree" tabindex="0" aria-label="Search tree. Use arrow keys to navigate nodes."></canvas><button id="branch-action" hidden></button><span class="hint muted">Drag to pan / Scroll to Zoom / Click to inspect</span></div>
  <div id="details-resizer" class="splitter vertical" role="separator" aria-label="Details panel width" aria-orientation="vertical" aria-controls="details" tabindex="0" title="Drag to resize details · double-click to reset"></div>
  <aside id="details">
    <h2 id="node-title">Selected node</h2><img id="node-image" alt="Selected molecule" hidden>
    <div class="node-state"><div id="node-key"></div><button id="copy-node" class="copy-button" type="button" aria-label="Copy to clipboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button></div>
    <span id="copy-status" class="sr-only" role="status"></span>
    <div class="node-actions"><button id="parent">Move to parent</button><button id="extract-path">Extract path</button><button id="fold">Fold branch</button></div>
    <p id="path-status" class="muted" role="status" hidden></p>
    <dl id="stats"></dl>
    <div id="result-detail" hidden><h2>Selected result</h2><p id="result-source" class="muted"></p><img id="result-image" alt="Generated molecule" hidden><div id="result-key"></div></div>
  </aside>
</div>
<div id="results-resizer" class="splitter horizontal" role="separator" aria-label="Results panel height" aria-orientation="horizontal" aria-controls="workspace results" tabindex="0" title="Drag to resize results · double-click to reset"></div>
<section class="results" id="results">
  <div class="toolbar"><h2>Generation results</h2><input id="search" type="search" placeholder="Filter results…" aria-label="Filter results"><span id="row-count" class="muted"></span><span class="spacer"></span><button id="previous">Previous</button><span id="page" class="muted"></span><button id="next">Next</button></div>
  <div class="table-scroll"><table id="result-table"><colgroup id="column-widths"></colgroup><thead><tr id="columns"></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="muted" hidden>No matching results.</div></div>
</section>
</div>
<section id="scatter-view" hidden><iframe id="scatter-frame" title="Molecule scatter plot"></iframe></section>
<script id="scatter-template" type="application/json">/*__SCATTER_VIEWER__*/</script>
<script id="tree-data" type="application/json">/*__TREE_DATA__*/</script>
<script>
(async () => {
  'use strict';
  async function unpack(value) {
    const binary = atob(value.data), bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream);
  }
  const payload = JSON.parse(document.getElementById('tree-data').textContent);
  const data = payload.encoding === 'gzip' ? await (await unpack(payload)).json() : payload;
  const $ = id => document.getElementById(id);
  const nodes = data.nodes;
  const treeNodeCount = nodes.length;
  // A matching molecule key can also belong to an unfinished node. Only direct
  // evaluations identify tree nodes; rollout orders belong to the rollout below.
  for (const row of data.rows) {
    if (!row.is_rollout && row.node_id !== null && nodes[row.node_id]) nodes[row.node_id].generation_order = row.values[0];
  }
  data.rows.forEach((row, rowIndex) => {
    if (!row.is_rollout || row.node_id === null || !nodes[row.node_id]) return;
    row.rollout_id = nodes.length;
    nodes.push({
      id: nodes.length, parent: row.node_id, key: row.values[2], state: row.state ?? row.values[2],
      type: row.type || 'Rollout', depth: nodes[row.node_id].depth+1, n_children: 0,
      reward: row.values[3], generation_order: row.values[0], last_action: 'rollout', action_label: 'rollout',
      image: row.image, rollout: true, rollout_from: `#${row.node_id}`, row_index: rowIndex, pruned: false,
    });
  });
  const canvas = $('tree'), ctx = canvas.getContext('2d');
  const children = nodes.map(() => []), depths = nodes.map(() => 0);
  for (const node of nodes) {
    if (node.parent !== null) {
      children[node.parent].push(node.id);
      depths[node.id] = depths[node.parent] + 1;
    }
  }
  for (const node of nodes) node.n_children ??= children[node.id].filter(child => !nodes[child].rollout).length;
  const maxDepth = depths.reduce((a, b) => Math.max(a, b), 0);
  $('depth').max = maxDepth;
  $('depth').value = Math.min(3, maxDepth);
  $('summary').textContent = `${data.name}   ${treeNodeCount.toLocaleString()} nodes   ${(nodes.length-treeNodeCount).toLocaleString()} rollouts   ${data.rows.length.toLocaleString()} results`;
  document.title = `${data.name} — ChemTSv3 visualizer`;
  let selected = 0, selectedRow = null, visible = [], positions = new Map(), path = new Set();
  let alignedPath = null;
  let scale = 1, offsetX = 0, offsetY = 0, width = 1, height = 1;
  let page = 0, sortColumn = 0, sortDirection = -1, filtered = [];
  let drawPending = false;
  let columnWidths = null;
  let copyReset = null;
  let scatterInitialized = false, scatterReady = false;
  const expanded = new Set([0]), imageCache = new Map(), imageSources = new Map(), pageSize = 100;
  let hiddenCounts = new Map(), hoverAction = null;
  const hasImages = data.rows.some(row => row.image !== null);
  const text = value => typeof value === 'object' && value !== null ? JSON.stringify(value) : String(value ?? '');
  const short = (value, size = 23) => { const s = text(value).replace(/\s+/g, ' '); return s.length > size ? s.slice(0, size - 1) + '…' : s; };
  const hasReward = node => node.reward !== null && node.reward !== undefined;
  const boxHeight = node => (node.image === null ? 58 : 108)+(hasReward(node) ? 30 : 0);
  const displayState = node => node.state ?? node.key;
  const displayNumber = node => node.rollout ? node.id-treeNodeCount : node.id;
  const nodeLabel = node => `${node.rollout ? 'Rollout' : 'Node'} #${displayNumber(node)}`;
  const eligibleChildren = id => children[id].filter(child => $('rollouts').checked || !nodes[child].rollout);

  function setView(view) {
    const scatter = view === 'scatter';
    $('tree-view').hidden = scatter; $('scatter-view').hidden = !scatter;
    $('view-tree').setAttribute('aria-pressed', String(!scatter)); $('view-scatter').setAttribute('aria-pressed', String(scatter));
    hideBranchAction();
    if (!scatter) { constrainPanels(); resizeTreeCanvas(); return; }
    const frame = $('scatter-frame');
    if (!scatterInitialized) {
      scatterInitialized = true;
      frame.onload = async () => {
        try {
          await frame.contentWindow.initializeScatter(data, {
            imageSource, copyText: writeClipboard,
            canMoveToTree: index => {
              const row = data.rows[index], id = row.rollout_id ?? row.node_id;
              return id !== null && id !== undefined && !!nodes[id];
            },
            moveToTree: index => {
              const row = data.rows[index], id = row.rollout_id ?? row.node_id;
              if (id === null || id === undefined || !nodes[id]) return;
              setView('tree'); select(id, index); alignPath(true);
            },
          }, selectedRow);
          scatterReady = true;
        } catch (error) {
          frame.contentDocument.getElementById('status').textContent = 'Could not load scatter plot.';
          console.error(error);
        }
      };
      frame.srcdoc = JSON.parse($('scatter-template').textContent);
    } else if (scatterReady && selectedRow !== null) frame.contentWindow.selectResult(selectedRow);
  }

  function bindResizer(handle, axis, begin, move, reset) {
    let resizing = null;
    const coordinate = event => axis === 'x' ? event.clientX : event.clientY;
    const finish = () => {
      resizing = null; handle.classList.remove('active');
      document.body.classList.remove('resizing'); document.body.style.cursor = '';
    };
    handle.onpointerdown = event => {
      if (event.button !== 0) return;
      event.preventDefault();
      handle.focus({preventScroll: true});
      resizing = {pointerId: event.pointerId, coordinate: coordinate(event), value: begin()};
      handle.setPointerCapture(event.pointerId); handle.classList.add('active');
      document.body.classList.add('resizing'); document.body.style.cursor = axis === 'x' ? 'col-resize' : 'row-resize';
    };
    handle.onpointermove = event => {
      if (resizing && event.pointerId === resizing.pointerId) move(resizing.value, coordinate(event)-resizing.coordinate);
    };
    handle.onpointerup = handle.onpointercancel = event => {
      if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
      finish();
    };
    handle.onlostpointercapture = finish;
    handle.ondblclick = reset;
    handle.onkeydown = event => {
      const direction = axis === 'x' ? {ArrowLeft: -1, ArrowRight: 1} : {ArrowUp: -1, ArrowDown: 1};
      if (direction[event.key]) { event.preventDefault(); move(begin(), direction[event.key]*(event.shiftKey ? 50 : 20)); }
      if (event.key === 'Home') { event.preventDefault(); reset(); }
    };
  }

  function resizeValue(handle, min, max, value, description) {
    handle.setAttribute('aria-valuemin', Math.round(min)); handle.setAttribute('aria-valuemax', Math.round(max));
    handle.setAttribute('aria-valuenow', Math.round(value)); handle.setAttribute('aria-valuetext', description);
  }

  function setDetailsWidth(value) {
    const max = Math.max(120, $('workspace').clientWidth-128), min = Math.min(180, max);
    value = Math.max(min, Math.min(max, value));
    $('workspace').style.setProperty('--details-width', `${value}px`);
    resizeValue($('details-resizer'), min, max, value, `Details width ${Math.round(value)} pixels`);
  }

  function setTreeHeight(value) {
    const available = document.body.clientHeight-$('workspace').offsetTop-$('results-resizer').offsetHeight;
    const max = Math.max(180, available-140);
    value = Math.max(180, Math.min(max, value));
    $('workspace').style.setProperty('--workspace-height', `${value}px`);
    resizeValue($('results-resizer'), 180, max, value, `Tree height ${Math.round(value)} pixels; results height ${Math.round(available-value)} pixels`);
  }

  function applyColumnWidths() {
    const table = $('result-table');
    table.style.tableLayout = columnWidths ? 'fixed' : '';
    table.style.width = columnWidths ? `${columnWidths.reduce((sum, value) => sum+value, 0)}px` : '';
    Array.from($('column-widths').children).forEach((col, index) => { col.style.width = columnWidths ? `${columnWidths[index]}px` : ''; });
    if (columnWidths) Array.from($('columns').children).forEach((th, index) => {
      resizeValue(th.querySelector('.column-resizer'), 60, 4000, columnWidths[index], `${Math.round(columnWidths[index])} pixels`);
    });
  }

  function appendColumn(th, label) {
    const index = $('columns').children.length, handle = document.createElement('span');
    handle.className = 'column-resizer'; handle.tabIndex = 0; handle.setAttribute('role', 'separator');
    handle.setAttribute('aria-label', `Resize ${label} column`); handle.setAttribute('aria-orientation', 'vertical');
    handle.title = 'Drag to resize column · double-click to reset column widths';
    th.append(handle); $('columns').append(th); $('column-widths').append(document.createElement('col'));
    bindResizer(handle, 'x', () => {
      columnWidths = Array.from($('columns').children).map(column => column.getBoundingClientRect().width);
      return columnWidths[index];
    }, (start, delta) => {
      columnWidths[index] = Math.max(60, Math.min(4000, start+delta)); applyColumnWidths();
    }, () => { columnWidths = null; applyColumnWidths(); });
  }

  function layout() {
    hideBranchAction();
    const stack = [0], visibleChildren = new Map();
    visible = []; hiddenCounts = new Map();
    while (stack.length) {
      const id = stack.pop();
      visible.push(id);
      const eligible = eligibleChildren(id), next = expanded.has(id) ? eligible : [];
      hiddenCounts.set(id, eligible.length-next.length);
      visibleChildren.set(id, next);
      for (let i = next.length - 1; i >= 0; i--) stack.push(next[i]);
    }
    positions = new Map();
    const contours = new Map();
    for (let i = visible.length - 1; i >= 0; i--) {
      const id = visible[i], next = visibleChildren.get(id);
      const left = [], right = [];
      positions.set(id, {x: 0, y: depths[id] * 166});
      // Pack subtrees by their contours. Cousins get one extra node of space.
      next.forEach((child, index) => {
        const outline = contours.get(child);
        let shift = 0;
        if (index) for (let depth = 0; depth < Math.min(right.length, outline.left.length); depth++) {
          shift = Math.max(shift, right[depth] + (depth === 0 ? 184 : 344) - outline.left[depth]);
        }
        positions.get(child).x = shift;
        for (let depth = 0; depth < outline.left.length; depth++) {
          left[depth] = Math.min(left[depth] ?? Infinity, outline.left[depth]+shift);
          right[depth] = Math.max(right[depth] ?? -Infinity, outline.right[depth]+shift);
        }
        contours.delete(child);
      });
      const center = next.length ? (positions.get(next[0]).x + positions.get(next[next.length-1]).x)/2 : 0;
      for (const child of next) positions.get(child).x -= center;
      contours.set(id, {left: [0, ...left.map(x => x-center)], right: [0, ...right.map(x => x-center)]});
    }
    // Convert the relative child offsets to canvas coordinates, top down.
    for (const id of visible) {
      if (nodes[id].parent !== null) positions.get(id).x += positions.get(nodes[id].parent).x;
    }
    if (alignedPath) compactPathLayout();
    canvas.setAttribute('aria-label', `Search tree: ${visible.length} visible nodes. Use arrow keys to navigate nodes.`);
    updateBranchControls();
    draw();
  }

  function updateBranchControls() {
    $('fold').disabled = !eligibleChildren(selected).length;
    $('fold').textContent = expanded.has(selected) ? 'Fold branch' : 'Expand';
  }

  function expandNode(id) {
    const before = positions.get(id);
    // Result clicks align the path; manual expansion releases that alignment
    // so every parent can sit above the center of its visible children.
    alignedPath = null;
    expanded.add(id); layout();
    const after = positions.get(id);
    if (before && after) {
      offsetX += (before.x-after.x)*scale;
      const bottom = eligibleChildren(id).reduce((max, child) => {
        const p = positions.get(child);
        return Math.max(max, p.y+boxHeight(nodes[child])+(hiddenCounts.get(child) ? 42 : 0));
      }, -Infinity);
      offsetY -= Math.max(0, bottom*scale+offsetY-height+24);
    }
    draw();
  }

  function showDepth() {
    const limit = Number($('depth').value);
    for (const node of nodes) if (depths[node.id] < limit) expanded.add(node.id);
    layout(); fit();
  }

  function resetTree() {
    alignedPath = null;
    expanded.clear(); expanded.add(0);
    $('depth').value = Math.min(3, maxDepth); updateDepthLabel();
    $('rollouts').checked = true;
    select(0); fit();
  }

  function updateVisibility() {
    layout();
    if (!positions.has(selected)) {
      let id = nodes[selected].parent;
      while (id !== null && !positions.has(id)) id = nodes[id].parent;
      select(id ?? 0, selectedRow, true);
    } else fit();
  }

  function updateDepthLabel() {
    $('depth-value').value = $('depth').value;
    $('show-depth').textContent = `Show up to depth ${$('depth').value}`;
  }

  function hideBranchAction() {
    hoverAction = null; $('branch-action').hidden = true;
  }

  function showBranchAction(event) {
    const action = branchHit(event), button = $('branch-action');
    if (!action) { hideBranchAction(); return; }
    hoverAction = action;
    button.textContent = action.kind === 'expand' ? 'Expand' : 'Move to parent';
    button.setAttribute('aria-label', `${button.textContent} node #${action.id}`);
    button.hidden = false;
    const rect = canvas.getBoundingClientRect();
    button.style.left = `${Math.max(4, Math.min(width-button.offsetWidth-4, event.clientX-rect.left-button.offsetWidth/2))}px`;
    button.style.top = `${Math.max(4, Math.min(height-button.offsetHeight-4, event.clientY-rect.top-button.offsetHeight/2))}px`;
  }

  function getImage(id) {
    if (!imageCache.has(id)) {
      const img = new Image();
      img.onload = () => {
        if (!drawPending) {
          drawPending = true;
          requestAnimationFrame(() => { drawPending = false; draw(); });
        }
      };
      imageSource(id).then(src => { img.src = src; }).catch(console.error);
      imageCache.set(id, img);
    }

  $('view-tree').onclick = () => setView('tree'); $('view-scatter').onclick = () => setView('scatter');
  $('zoom-in').onclick = () => zoom(1.35); $('zoom-out').onclick = () => zoom(1/1.35);
  $('depth').oninput = updateDepthLabel; $('show-depth').onclick = showDepth; $('reset').onclick = resetTree;
  $('rollouts').onchange = updateVisibility;
  $('parent').onclick = () => select(nodes[selected].parent, null, true); $('fold').onclick = () => toggleFold(selected);
  $('extract-path').onclick = extractPath;
  $('copy-node').onclick = copyNodeState;
  $('search').oninput = () => { page = 0; updateResults(); };
  $('previous').onclick = () => { page--; renderRows(); }; $('next').onclick = () => { page++; renderRows(); };
  bindResizer($('details-resizer'), 'x', () => $('details').getBoundingClientRect().width,
    (start, delta) => setDetailsWidth(start-delta), () => {
      $('workspace').style.removeProperty('--details-width'); setDetailsWidth($('details').getBoundingClientRect().width);
    });
  bindResizer($('results-resizer'), 'y', () => $('workspace').getBoundingClientRect().height,
    (start, delta) => setTreeHeight(start+delta), () => {
      $('workspace').style.removeProperty('--workspace-height'); setTreeHeight($('workspace').getBoundingClientRect().height);
    });
  const constrainPanels = () => {
    if ($('tree-view').hidden) return;
    setDetailsWidth($('details').getBoundingClientRect().width); setTreeHeight($('workspace').getBoundingClientRect().height);
  };
  window.addEventListener('resize', constrainPanels); constrainPanels();
  function resizeTreeCanvas() {
    if ($('tree-view').hidden) return;
    hideBranchAction();
    const nextWidth = canvas.clientWidth, nextHeight = canvas.clientHeight;
    offsetX += (nextWidth-width)/2; offsetY += (nextHeight-height)/2;
    width = nextWidth; height = nextHeight;
    const ratio = window.devicePixelRatio || 1; canvas.width = width*ratio; canvas.height = height*ratio; draw();
  }
  new ResizeObserver(resizeTreeCanvas).observe(canvas);
  width = canvas.clientWidth; height = canvas.clientHeight;
  updateResults(); resetTree();
})().catch(error => {
  document.getElementById('summary').textContent = 'Could not load visualization. Please use an up-to-date browser.';
  console.error(error);
});
</script>
</html>
